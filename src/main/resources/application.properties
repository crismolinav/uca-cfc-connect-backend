spring.application.name=uca-cfc-connect
spring.config.import=optional:file:.env[.properties]

# No convertir silenciosamente valores decimales a campos enteros (por ejemplo, 10.5 cupos).
spring.jackson.deserialization.accept-float-as-int=false

# Puerto de la API
server.port=${SERVER_PORT:8080}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${AUTH_COOKIE_SECURE:false}

# Base MySQL existente. En otros ambientes, definir DB_URL, DB_USERNAME y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/uca_cfc_connect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/El_Salvador}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Valida el mapeo contra el esquema existente; nunca crea ni modifica tablas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Autenticación local y JWT. JWT_SECRET debe definirse fuera del repositorio.
app.jwt.secret=${JWT_SECRET:uca-cfc-connect-development-secret-change-me}
app.jwt.issuer=${JWT_ISSUER:uca-cfc-connect}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.auth.default-role=${DEFAULT_USER_ROLE:CLIENTE}
app.auth.cookie-name=${AUTH_COOKIE_NAME:uca_cfc_session}
# En producción debe ser true para que la cookie viaje únicamente mediante HTTPS.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}

# Invitaciones locales: sin SMTP devuelve un enlace de prueba solo a recepción.
# Para envío real desde Gmail: INVITATION_DELIVERY=smtp, MAIL_USERNAME y MAIL_PASSWORD
# (contraseña de aplicación de Google). Nunca guardar esos valores en Git.
app.invitation.delivery=${INVITATION_DELIVERY:local}
app.invitation.base-url=${INVITATION_BASE_URL:http://localhost:8080}
# URL fija para los enlaces de recuperación; nunca se toma de la cabecera Host.
app.password-reset.base-url=${PASSWORD_RESET_BASE_URL:${INVITATION_BASE_URL:http://localhost:8080}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Evita que JavaMail use un nombre local con caracteres no ASCII en EHLO.
spring.mail.properties.mail.smtp.localhost=localhost
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Orígenes autorizados para el frontend y destinos posteriores a OAuth.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:8080/auth/callback.html}
app.oauth2.failure-redirect-uri=${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:8080/auth/login.html}

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
