<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Activa tu cuenta de UCA CFC Connect con la invitación de recepción.">
    <title>Aceptar invitación | UCA CFC Connect</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/invitacion.js" defer></script>
</head>
<body>
<main class="auth-layout">
    <section class="auth-panel" aria-labelledby="page-title">
        <div class="auth-card auth-card-register">
            <a class="brand" href="/" aria-label="UCA CFC Connect, inicio">
                <span class="brand-mark" aria-hidden="true">U</span><span>UCA CFC Connect</span>
            </a>
            <header class="auth-heading">
                <h1 id="page-title">Crea tu cuenta</h1>
                <p>Recepción te invitó a completar tu registro. Tu cuenta quedará vinculada a tu ficha de cliente.</p>
            </header>
            <p id="invitation-status" class="form-status" role="status" aria-live="polite">Comprobando invitación...</p>
            <form id="invitation-form" class="auth-form" hidden>
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" autocomplete="name" readonly>
                </div>
                <div class="field">
                    <label for="correo">Correo invitado</label>
                    <input id="correo" type="email" autocomplete="email" readonly>
                </div>
                <div class="field">
                    <label for="dui">DUI</label>
                    <input id="dui" name="dui" type="text" inputmode="numeric" autocomplete="off"
                           placeholder="12345678-9" maxlength="10" pattern="[0-9]{8}-[0-9]" required
                           aria-describedby="dui-help">
                    <p id="dui-help" class="field-help">Si recepción ya registró tu DUI, debe coincidir con ese dato.</p>
                </div>
                <div class="field">
                    <label for="password">Contraseña</label>
                    <input id="password" name="password" type="password" autocomplete="new-password"
                           minlength="8" maxlength="72" required aria-describedby="password-help">
                    <p id="password-help" class="field-help">Utiliza entre 8 y 72 caracteres.</p>
                </div>
                <label class="check-control">
                    <input id="aceptaTerminos" name="aceptaTerminos" type="checkbox" required>
                    <span>Acepto los términos y la política de privacidad.</span>
                </label>
                <button class="primary-button" type="submit">Crear cuenta</button>
            </form>
            <p class="auth-switch">¿Ya tienes cuenta? <a href="/auth/login.html">Iniciar sesión</a></p>
        </div>
    </section>
    <aside class="auth-visual" aria-hidden="true"><img src="/assets/students-studying.png" alt=""></aside>
</main>
</body>
</html>
