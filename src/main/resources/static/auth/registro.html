<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Crea una cuenta en UCA CFC Connect.">
    <title>Crear cuenta | UCA CFC Connect</title>
    <link rel="stylesheet" href="/css/auth.css">
    <script src="/js/auth.js" defer></script>
</head>
<body data-page="registro">
<main class="auth-layout">
    <section class="auth-panel" aria-labelledby="page-title">
        <div class="auth-card auth-card-register">
            <a class="brand" href="/" aria-label="UCA CFC Connect, inicio">
                <span class="brand-mark" aria-hidden="true">U</span>
                <span>UCA CFC Connect</span>
            </a>

            <header class="auth-heading">
                <h1 id="page-title">Crea tu cuenta</h1>
                <p>Completa tus datos y empieza a conectar con la comunidad.</p>
            </header>

            <form id="registro-form" class="auth-form" novalidate>
                <div class="field">
                    <label for="nombre">Nombre completo</label>
                    <input id="nombre" name="nombre" type="text" autocomplete="name"
                           placeholder="Ingresa tu nombre" maxlength="100" required aria-describedby="nombre-error">
                    <p id="nombre-error" class="field-error" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="dui">DUI</label>
                    <input id="dui" name="dui" type="text" inputmode="numeric" autocomplete="off"
                           placeholder="12345678-9" maxlength="10" pattern="[0-9]{8}-[0-9]" required
                           aria-describedby="dui-help dui-error">
                    <p id="dui-help" class="field-help">Escríbelo con guion, como aparece en tu documento.</p>
                    <p id="dui-error" class="field-error" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="correo">Correo electrónico</label>
                    <input id="correo" name="correo" type="email" autocomplete="email"
                           placeholder="nombre@correo.com" maxlength="120" required aria-describedby="correo-error">
                    <p id="correo-error" class="field-error" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <div class="password-control">
                        <input id="password" name="password" type="password" autocomplete="new-password"
                               placeholder="Mínimo 8 caracteres" minlength="8" maxlength="72" required
                               aria-describedby="password-help password-error">
                        <button class="password-toggle" type="button" data-password-toggle
                                aria-controls="password" aria-label="Mostrar contraseña">Mostrar</button>
                    </div>
                    <p id="password-help" class="field-help">Utiliza entre 8 y 72 caracteres.</p>
                    <p id="password-error" class="field-error" aria-live="polite"></p>
                </div>

                <label class="check-control">
                    <input id="aceptaTerminos" name="aceptaTerminos" type="checkbox" required
                           aria-describedby="aceptaTerminos-error">
                    <span>Acepto los términos y la política de privacidad.</span>
                </label>
                <p id="aceptaTerminos-error" class="field-error checkbox-error" aria-live="polite"></p>

                <p id="form-status" class="form-status" role="alert"></p>

                <button class="primary-button" type="submit" data-idle-label="Crear cuenta">
                    Crear cuenta
                </button>
            </form>

            <div class="divider"><span>o regístrate con</span></div>

            <a class="google-button" href="/api/v1/auth/google">
                <img src="/assets/google.svg" width="24" height="24" alt="">
                <span>Continuar con Google</span>
            </a>

            <p class="auth-switch">¿Ya tienes una cuenta? <a href="/auth/login.html">Iniciar sesión</a></p>
        </div>
    </section>

    <aside class="auth-visual" aria-hidden="true">
        <img src="/assets/students-studying.png" alt="">
    </aside>
</main>
</body>
</html>
